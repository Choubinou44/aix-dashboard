<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Appart Aix">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Recherche Appart — Aix</title>
<style>
  :root {
    --bg: #12121f;
    --card: #1e1e32;
    --card2: #26263e;
    --text: #f0f0f5;
    --muted: #9a9ab0;
    --accent: #7c6cf0;
    --green: #34c77b;
    --orange: #f5a623;
    --red: #e85d5d;
    --border: #33334d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
  }
  header {
    padding: calc(14px + env(safe-area-inset-top)) 18px 10px;
    position: sticky; top: 0; z-index: 10;
    background: rgba(18,18,31,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .daytabs { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; }
  .daytab {
    flex: 1; text-align: center; padding: 8px 4px; border-radius: 12px;
    background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); cursor: pointer; white-space: nowrap;
  }
  .daytab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .daytab .dnum { display: block; font-size: 16px; }
  main { padding: 16px; }
  .section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 20px 4px 10px; font-weight: 700;
  }
  .section-title:first-child { margin-top: 4px; }
  .progress {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 4px;
  }
  .progress .ptext { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .pbar { height: 8px; background: var(--card2); border-radius: 4px; overflow: hidden; }
  .pbar > div { height: 100%; background: var(--green); border-radius: 4px; transition: width .3s; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; margin-bottom: 10px;
  }
  .card.done { opacity: 0.55; }
  .row { display: flex; align-items: flex-start; gap: 12px; }
  .check {
    width: 26px; height: 26px; min-width: 26px; border-radius: 50%;
    border: 2px solid var(--muted); background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #fff; cursor: pointer; margin-top: 2px;
  }
  .check.on { background: var(--green); border-color: var(--green); }
  .grow { flex: 1; min-width: 0; }
  .time-badge {
    font-size: 13px; font-weight: 700; color: var(--accent);
    background: rgba(124,108,240,0.15); padding: 3px 8px; border-radius: 8px;
    display: inline-block; margin-bottom: 4px;
  }
  .title { font-size: 16px; font-weight: 650; }
  .card.done .title { text-decoration: line-through; }
  .addr { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .addr a { color: var(--muted); text-decoration: underline; }
  .note { font-size: 13px; color: var(--orange); margin-top: 4px; }
  .apts { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .apt {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
  }
  .apt + .apt { border-top: 1px dashed var(--border); }
  .apt .check { width: 22px; height: 22px; min-width: 22px; font-size: 12px; margin-top: 0; }
  .apt .alabel { flex: 1; font-size: 14px; min-width: 0; }
  .apt .alabel .asub { font-size: 12px; color: var(--muted); }
  .apt.done-apt .alabel { text-decoration: line-through; opacity: 0.6; }
  .status-btn {
    font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 10px;
    border: none; cursor: pointer; white-space: nowrap;
  }
  .st-none { background: var(--card2); color: var(--muted); }
  .st-attente { background: rgba(245,166,35,0.2); color: var(--orange); }
  .st-refus { background: rgba(232,93,93,0.2); color: var(--red); }
  .st-accepte { background: rgba(52,199,123,0.2); color: var(--green); }
  .st-interesse { background: rgba(124,108,240,0.25); color: #b3a8ff; }
  .mini-btn {
    background: none; border: none; color: var(--muted); font-size: 18px;
    padding: 4px 8px; cursor: pointer;
  }
  .add-inline {
    width: 100%; margin-top: 8px; padding: 8px; border-radius: 10px;
    background: var(--card2); border: 1px dashed var(--border);
    color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .empty { text-align: center; color: var(--muted); padding: 30px 20px; font-size: 14px; }
  .fab {
    position: fixed; right: 18px; bottom: calc(80px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 28px; border: none;
    box-shadow: 0 4px 16px rgba(124,108,240,0.5); cursor: pointer; z-index: 20;
  }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; background: rgba(18,18,31,0.95);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 10px 0 8px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  nav button .ico { display: block; font-size: 22px; margin-bottom: 2px; }
  nav button.active { color: var(--accent); }
  /* modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50;
    display: none; align-items: flex-end;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--card); width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 16px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card2); color: var(--text); font-size: 16px;
    font-family: inherit; -webkit-appearance: none;
  }
  .modal .btns { display: flex; gap: 10px; margin-top: 20px; }
  .modal .btns button {
    flex: 1; padding: 14px; border-radius: 14px; border: none;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn-cancel { background: var(--card2); color: var(--muted); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-del { background: rgba(232,93,93,0.2); color: var(--red); }
  .recap-stats { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 6px; text-align: center;
  }
  .stat .n { font-size: 22px; font-weight: 800; }
  .stat .l { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="hdr-title">Missions du jour</h1>
  <div class="sub" id="hdr-sub"></div>
  <div class="daytabs" id="daytabs"></div>
</header>
<main id="main"></main>
<button class="fab" id="fab" title="Ajouter un RDV">+</button>
<nav>
  <button id="nav-today" class="active"><span class="ico">📋</span>Missions</button>
  <button id="nav-recap"><span class="ico">🏠</span>Apparts</button>
</nav>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<script>
const DAYS = [
  { key: '2026-07-28', label: 'Mar', num: '28', title: 'Mardi 28 — Centre-ville à pied' },
  { key: '2026-07-29', label: 'Mer', num: '29', title: 'Mercredi 29 — Sud & Velaux en voiture' },
  { key: '2026-07-30', label: 'Jeu', num: '30', title: 'Jeudi 30 — Visites d\'appartements' },
];

const SEED = {
  agencies: [
    { id:'era', name:'Era Immobilier', address:"11 Rue de l'Opéra", day:'2026-07-28', time:'09:00', note:'PRIORITÉ n°1 — 3 apparts à voir', done:false },
    { id:'nova', name:'Nova Immobilier', address:'1 Ter Rue Manuel', day:'2026-07-28', time:'09:30', note:'', done:false },
    { id:'comtesse', name:'La Comtesse Immobilier', address:"47 Rue d'Italie", day:'2026-07-28', time:'10:00', note:'1 appart vu, réponse négative', done:false },
    { id:'drujon', name:'Drujon d\'Astros / GCD', address:'Place de la Rotonde', day:'2026-07-28', time:'10:30', note:'Adresse à confirmer (9 rue Victor Leydet ?)', done:false },
    { id:'foncia', name:'Foncia', address:'21 Av. Victor Hugo', day:'2026-07-28', time:'11:00', note:'5 apparts à voir — prévoir large', done:false },
    { id:'figuiere', name:'Sextius Mirabeau / Figuière', address:'1-3 Av. Victor Hugo', day:'2026-07-28', time:'12:00', note:'', done:false },
    { id:'lamy', name:'Agence Lamy', address:'Domaine la Parade, Route des Milles', day:'2026-07-29', time:'09:00', note:'', done:false },
    { id:'valority', name:'Valority', address:'320 Rue Émilien Gautier', day:'2026-07-29', time:'10:00', note:'', done:false },
    { id:'acd', name:'ACD Immobilier', address:'160 Av. de la République, Velaux', day:'2026-07-29', time:'11:00', note:'Visite déjà prévue', done:false },
  ],
  apartments: [
    { id:'a1', agencyId:'era', label:'Appart Era n°1', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a2', agencyId:'era', label:'Appart Era n°2', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a3', agencyId:'era', label:'Appart Era n°3', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a4', agencyId:'nova', label:'Appart Nova', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a5', agencyId:'comtesse', label:'Appart La Comtesse', day:'', time:'', done:true, status:'refus', note:'Déjà visité — réponse négative' },
    { id:'a6', agencyId:'drujon', label:'Appart Drujon', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a7', agencyId:'foncia', label:'Appart Foncia n°1', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a8', agencyId:'foncia', label:'Appart Foncia n°2', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a9', agencyId:'foncia', label:'Appart Foncia n°3', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a10', agencyId:'foncia', label:'Appart Foncia n°4', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a11', agencyId:'foncia', label:'Appart Foncia n°5', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a12', agencyId:'figuiere', label:'Appart Figuière', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a13', agencyId:'lamy', label:'Appart Lamy', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a14', agencyId:'valority', label:'Appart Valority', day:'', time:'', done:false, status:'interesse', note:'' },
    { id:'a15', agencyId:'acd', label:'Appart ACD (Velaux)', day:'2026-07-29', time:'11:00', done:false, status:'interesse', note:'Visite déjà prévue avec le RDV agence' },
  ],
};

const STATUSES = [
  { key:'interesse', label:'Intéressé', cls:'st-interesse' },
  { key:'attente', label:'⏳ Attente', cls:'st-attente' },
  { key:'accepte', label:'✅ Accepté', cls:'st-accepte' },
  { key:'refus', label:'❌ Refus', cls:'st-refus' },
  { key:'none', label:'—', cls:'st-none' },
];

let state;
function load() {
  try {
    const raw = localStorage.getItem('aix-dashboard-v1');
    state = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED));
  } catch(e) { state = JSON.parse(JSON.stringify(SEED)); }
}
function save() { localStorage.setItem('aix-dashboard-v1', JSON.stringify(state)); }

function todayKey() {
  const now = new Date();
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

let view = 'today';
let currentDay = DAYS.some(d => d.key === todayKey()) ? todayKey() : DAYS[0].key;

const $ = id => document.getElementById(id);

function statusInfo(key) { return STATUSES.find(s => s.key === key) || STATUSES[4]; }
function agencyById(id) { return state.agencies.find(a => a.id === id); }
function fmtDay(key) { const d = DAYS.find(x => x.key === key); return d ? d.label + ' ' + d.num : key; }
function mapsLink(addr) {
  return `https://maps.apple.com/?q=${encodeURIComponent(addr + ', Aix-en-Provence')}`;
}

function render() {
  renderTabs();
  if (view === 'today') renderDay(); else renderRecap();
}

function renderTabs() {
  const tabs = $('daytabs');
  if (view !== 'today') { tabs.style.display = 'none'; return; }
  tabs.style.display = 'flex';
  tabs.innerHTML = DAYS.map(d =>
    `<div class="daytab ${d.key===currentDay?'active':''}" onclick="setDay('${d.key}')">${d.label}<span class="dnum">${d.num}</span></div>`
  ).join('');
}
function setDay(k) { currentDay = k; render(); }

function aptRow(apt, showAgency) {
  const st = statusInfo(apt.status);
  const ag = agencyById(apt.agencyId);
  const sub = [
    showAgency && ag ? ag.name : '',
    apt.day ? '🗓 ' + fmtDay(apt.day) + (apt.time ? ' ' + apt.time : '') : '',
    apt.note || ''
  ].filter(Boolean).join(' · ');
  return `<div class="apt ${apt.done?'done-apt':''}">
    <button class="check ${apt.done?'on':''}" onclick="toggleApt('${apt.id}')">${apt.done?'✓':''}</button>
    <div class="alabel" onclick="editApt('${apt.id}')">${esc(apt.label)}${sub?`<div class="asub">${esc(sub)}</div>`:''}</div>
    <button class="status-btn ${st.cls}" onclick="cycleStatus('${apt.id}')">${st.label}</button>
  </div>`;
}

function renderDay() {
  const dayInfo = DAYS.find(d => d.key === currentDay);
  $('hdr-title').textContent = 'Missions du jour';
  $('hdr-sub').textContent = dayInfo.title;
  const agencies = state.agencies.filter(a => a.day === currentDay).sort((a,b) => a.time.localeCompare(b.time));
  const visits = state.apartments.filter(a => a.day === currentDay).sort((a,b) => (a.time||'99').localeCompare(b.time||'99'));

  const totalTasks = agencies.length + visits.length;
  const doneTasks = agencies.filter(a=>a.done).length + visits.filter(a=>a.done).length;

  let html = '';
  if (totalTasks > 0) {
    html += `<div class="progress"><div class="ptext">${doneTasks} / ${totalTasks} missions terminées</div>
      <div class="pbar"><div style="width:${totalTasks?Math.round(doneTasks/totalTasks*100):0}%"></div></div></div>`;
  }

  if (agencies.length) {
    html += '<div class="section-title">🏢 Agences à visiter</div>';
    for (const ag of agencies) {
      const apts = state.apartments.filter(a => a.agencyId === ag.id);
      const interesting = apts.filter(a => a.status !== 'none');
      html += `<div class="card ${ag.done?'done':''}">
        <div class="row">
          <button class="check ${ag.done?'on':''}" onclick="toggleAgency('${ag.id}')">${ag.done?'✓':''}</button>
          <div class="grow">
            <span class="time-badge">${ag.time}</span>
            <div class="title">${esc(ag.name)}</div>
            <div class="addr"><a href="${mapsLink(ag.address)}">📍 ${esc(ag.address)}</a></div>
            ${ag.note?`<div class="note">⚠️ ${esc(ag.note)}</div>`:''}
          </div>
        </div>
        ${interesting.length?`<div class="apts">${interesting.map(a=>aptRow(a,false)).join('')}
          <button class="add-inline" onclick="newApt('${ag.id}')">+ Ajouter un appart pour cette agence</button></div>`
        :`<div class="apts"><button class="add-inline" onclick="newApt('${ag.id}')">+ Ajouter un appart pour cette agence</button></div>`}
      </div>`;
    }
  }

  html += '<div class="section-title">🔑 Visites d\'appartements du jour</div>';
  if (visits.length) {
    html += `<div class="card">${visits.map(a=>aptRow(a,true)).join('')}</div>`;
  } else {
    html += '<div class="empty">Aucune visite prévue ce jour.<br>Appuie sur + pour ajouter un RDV.</div>';
  }

  if (!agencies.length && !visits.length) {
    html = '<div class="empty">Rien de prévu ce jour. Appuie sur + pour ajouter un RDV.</div>' ;
  }
  $('main').innerHTML = html;
}

function renderRecap() {
  $('hdr-title').textContent = 'Tous les appartements';
  const apts = state.apartments;
  const n = k => apts.filter(a=>a.status===k).length;
  $('hdr-sub').textContent = `${apts.length} apparts suivis`;
  let html = `<div class="recap-stats">
    <div class="stat"><div class="n" style="color:var(--green)">${n('accepte')}</div><div class="l">Acceptés</div></div>
    <div class="stat"><div class="n" style="color:var(--orange)">${n('attente')}</div><div class="l">En attente</div></div>
    <div class="stat"><div class="n" style="color:var(--red)">${n('refus')}</div><div class="l">Refus</div></div>
    <div class="stat"><div class="n">${apts.filter(a=>a.done).length}/${apts.length}</div><div class="l">Visités</div></div>
  </div>`;
  for (const ag of state.agencies) {
    const list = apts.filter(a => a.agencyId === ag.id);
    if (!list.length) continue;
    html += `<div class="card"><div class="title" style="margin-bottom:4px">${esc(ag.name)}</div>
      <div class="apts" style="border-top:none;padding-top:0">${list.map(a=>aptRow(a,false)).join('')}
      <button class="add-inline" onclick="newApt('${ag.id}')">+ Ajouter un appart</button></div></div>`;
  }
  const orphans = apts.filter(a => !agencyById(a.agencyId));
  if (orphans.length) {
    html += `<div class="card"><div class="title" style="margin-bottom:4px">Autres</div>
      <div class="apts" style="border-top:none;padding-top:0">${orphans.map(a=>aptRow(a,true)).join('')}</div></div>`;
  }
  $('main').innerHTML = html;
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toggleAgency(id) { const a = agencyById(id); a.done = !a.done; save(); render(); }
function toggleApt(id) { const a = state.apartments.find(x=>x.id===id); a.done = !a.done; save(); render(); }
function cycleStatus(id) {
  const a = state.apartments.find(x=>x.id===id);
  const order = ['interesse','attente','accepte','refus','none'];
  a.status = order[(order.indexOf(a.status)+1) % order.length];
  save(); render();
}

// ---- modal ----
function openModal(html) { $('modal').innerHTML = html; $('modal-bg').classList.add('open'); }
function closeModal() { $('modal-bg').classList.remove('open'); }
$('modal-bg').addEventListener('click', e => { if (e.target === $('modal-bg')) closeModal(); });

function aptForm(apt, agencyId) {
  const isNew = !apt;
  apt = apt || { label:'', agencyId: agencyId || state.agencies[0].id, day: currentDay, time:'', note:'', status:'interesse', done:false };
  return `<h2>${isNew?'Nouveau RDV / appart':'Modifier l\'appart'}</h2>
    <label>Nom / description</label>
    <input id="f-label" value="${esc(apt.label)}" placeholder="Ex : T2 Rue d'Italie, 750€">
    <label>Agence</label>
    <select id="f-agency">${state.agencies.map(a=>`<option value="${a.id}" ${a.id===apt.agencyId?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
    <label>Jour de la visite</label>
    <select id="f-day"><option value="">Pas encore de RDV</option>${DAYS.map(d=>`<option value="${d.key}" ${d.key===apt.day?'selected':''}>${d.title}</option>`).join('')}</select>
    <label>Heure</label>
    <input id="f-time" type="time" value="${esc(apt.time)}">
    <label>Statut du dossier</label>
    <select id="f-status">${STATUSES.map(s=>`<option value="${s.key}" ${s.key===apt.status?'selected':''}>${s.label}</option>`).join('')}</select>
    <label>Note</label>
    <textarea id="f-note" rows="2" placeholder="Adresse, prix, remarques…">${esc(apt.note)}</textarea>
    <div class="btns">
      ${isNew?'':`<button class="btn-del" onclick="deleteApt('${apt.id}')">Suppr.</button>`}
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveApt('${isNew?'':apt.id}')">Enregistrer</button>
    </div>`;
}
function newApt(agencyId) { openModal(aptForm(null, agencyId)); }
function editApt(id) { openModal(aptForm(state.apartments.find(a=>a.id===id))); }
function saveApt(id) {
  const vals = {
    label: $('f-label').value.trim() || 'Appart sans nom',
    agencyId: $('f-agency').value,
    day: $('f-day').value,
    time: $('f-time').value,
    status: $('f-status').value,
    note: $('f-note').value.trim(),
  };
  if (id) {
    Object.assign(state.apartments.find(a=>a.id===id), vals);
  } else {
    state.apartments.push({ id: 'a' + Date.now(), done:false, ...vals });
  }
  save(); closeModal(); render();
}
function deleteApt(id) {
  state.apartments = state.apartments.filter(a=>a.id!==id);
  save(); closeModal(); render();
}

$('fab').addEventListener('click', () => newApt());
$('nav-today').addEventListener('click', () => { view='today'; $('nav-today').classList.add('active'); $('nav-recap').classList.remove('active'); render(); });
$('nav-recap').addEventListener('click', () => { view='recap'; $('nav-recap').classList.add('active'); $('nav-today').classList.remove('active'); render(); });

load();
render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
